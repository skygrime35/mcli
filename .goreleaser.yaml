version: 2

project_name: mcli

before:
  hooks:
    - go mod tidy

builds:
  - id: mcli
    main: ./cmd/mcli
    binary: mcli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: mcli
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: skygrime35
    name: mcli

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
